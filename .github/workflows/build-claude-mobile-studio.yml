name: Build Claude Mobile Studio APK
on:
  push:
    branches: [build/claude-mobile-studio-20261112]
    paths:
      - scripts/compilar-claude-mobile-studio.sh
      - .github/workflows/build-claude-mobile-studio.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build app
        run: bash scripts/compilar-claude-mobile-studio.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeMobileStudio-debug-apk
          path: claude-mobile-studio-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
