name: Build Claude Mobile Studio v0.3 APK
on:
  push:
    branches:
      - build/claude-mobile-studio-v03-20261112
    paths:
      - 'ClaudeMobileStudio-v03.tar.xz.b64'
      - '.github/workflows/build-claude-mobile-v03-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find preinstalled Android SDK and install packages
        shell: bash
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_HOME" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$TOOL" ]; then echo "Android sdkmanager not found"; exit 1; fi
          yes | "$TOOL" --sdk_root="$SDK_HOME" --licenses >/dev/null || true
          "$TOOL" --sdk_root="$SDK_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack app
        run: |
          mkdir -p build-v03
          base64 -d ClaudeMobileStudio-v03.tar.xz.b64 | tar -xJ -C build-v03
          test -e build-v03/app/build.gradle
      - name: Repair invalid multiline Java string
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build-v03/app/src/main/java/com/claudemobilestudio/app/MainActivity.java")
          text=p.read_text(encoding="utf-8")
          original="900 KB cada." + chr(10) + "Arquivos como"
          fixed="900 KB cada." + chr(92) + "nArquivos como"
          if original not in text:
              print("Already patched, or source has changed")
          else:
              p.write_text(text.replace(original,fixed),encoding="utf-8")
              print("Fixed Java string literal")
          PY
      - name: Compile
        working-directory: build-v03
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeMobileStudio-v03-debug-apk
          path: build-v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
