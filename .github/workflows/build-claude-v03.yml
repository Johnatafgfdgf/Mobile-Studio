name: Build Claude Mobile Studio v0.3 APK
on:
  push:
    branches:
      - build/claude-mobile-studio-v03
    paths:
      - 'claude-mobile-studio-source.tar.xz.b64'
      - '.github/workflows/build-claude-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android source
        run: |
          mkdir -p claude-mobile-v03
          base64 -d claude-mobile-studio-source.tar.xz.b64 | tar -xJ -C claude-mobile-v03
      - name: Run code diff tests
        working-directory: claude-mobile-v03
        run: |
          mkdir -p /tmp/cms-tests
          javac -d /tmp/cms-tests app/src/main/java/com/claudemobilestudio/app/DiffUtil.java tests/DiffUtilTest.java
          java -cp /tmp/cms-tests com.claudemobilestudio.app.DiffUtilTest
      - name: Build APK
        working-directory: claude-mobile-v03
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeMobileStudio-v0.3-APK
          path: claude-mobile-v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
