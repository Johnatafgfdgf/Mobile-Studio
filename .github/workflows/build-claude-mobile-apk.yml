name: Build Claude Mobile Studio APK
on:
  push:
    branches:
      - build/claude-mobile-studio-apk
    paths:
      - 'claude-mobile-studio-source.tar.xz.b64'
      - '.github/workflows/build-claude-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android project
        run: |
          mkdir -p claude-mobile-studio-build
          base64 -d claude-mobile-studio-source.tar.xz.b64 | tar -xJ -C claude-mobile-studio-build
      - name: Compile Android APK
        working-directory: claude-mobile-studio-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeMobileStudio-debug-apk
          path: claude-mobile-studio-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
